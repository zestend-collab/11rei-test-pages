<style>
@import url('https://googleapis.com');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#cccccc;--card:#ffffff;--orange:#fab855;--link:#ff9900;
--ink:#1a1a18;--muted:#555555;--border:#aaaaaa;--row:#f7f7f7;
}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;font-weight:300;min-height:100vh}
main{max-width:1040px;margin:0 auto;padding:1.5rem 1rem 3rem}
header{background:var(--card);border:1px solid var(--border);border-radius:4px;
padding:1.4rem 1.6rem;margin-bottom:22px}
header h1{font-family:'EB Garamond',serif;font-weight:600;font-size:clamp(22px,4vw,30px)}
header .sub{font-family:'EB Garamond',serif;font-style:italic;color:var(--muted);font-size:.92rem;margin-top:.3rem}
header .back{display:inline-block;margin-top:.8rem;font-size:.8rem;color:var(--link);text-decoration:none}
header .back:hover{text-decoration:underline}
.confirmation-container{background:var(--card);border:1px solid var(--border);border-radius:4px;
padding:2.4rem 1.6rem;text-align:center}
.confirmation-container .icon{font-size:2.6rem;margin-bottom:.8rem}
.confirmation-container h2{font-family:'EB Garamond',serif;font-weight:600;font-size:1.4rem;margin-bottom:.6rem}
.confirmation-container p{color:var(--muted);margin-bottom:1.4rem}
.submit-btn{display:inline-flex;align-items:center;justify-content:center;
font-family:'Inter',sans-serif;font-size:.82rem;font-weight:500;
color:var(--ink);background:var(--orange);text-decoration:none;
padding:.6rem 1.4rem;border-radius:20px;border:none;cursor:pointer;transition:background 0.2s, color 0.2s}
.submit-btn:hover{background:var(--link);color:#fff}
footer{text-align:center;font-size:.72rem;color:var(--muted);margin-top:20px;font-style:italic}
</style>
</head>
<body>
<main>
<header>
<h1>Message envoyé</h1>
<div class="sub">Merci de nous avoir contactés au sujet du 11è régiment étranger d'infanterie</div>
<a class="back" href="https://www.11regimentetranger.com">← Retour à l'accueil</a>
</header>

<section class="confirmation-container">
<div class="icon">✅</div>
<h2>Votre message a bien été envoyé</h2>
<p>Nous vous répondrons dès que possible à l'adresse que vous avez indiquée.</p>
<a class="submit-btn" href="https://www.11regimentetranger.com">Retour à l'accueil</a>
</section>

<footer>© 11e REI — Tous droits réservés</footer>
</main>
</body>
</html>
