  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#eef1f4;--card:#ffffff;--orange:#fab855;--link:#ff9900;
    --ink:#1c2733;--muted:#5b6b7a;--border:#c7d0d9;--row:#f7f7f7;
  }
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;font-weight:300;min-height:100vh}
  main{max-width:640px;margin:0 auto;padding:4rem 1rem;text-align:center}

  h1{font-family:'EB Garamond',serif;font-weight:600;font-size:clamp(20px,4vw,28px);margin-top:.6rem}

  .actions{margin-top:2rem;display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;
    font-family:'Inter',sans-serif;font-size:.85rem;font-weight:500;
    text-decoration:none;padding:.6rem 1.4rem;border-radius:20px;
    transition:background .15s,color .15s}
  .btn-primary{color:var(--ink);background:var(--orange)}
  .btn-primary:hover{background:var(--link);color:#fff}
  .btn-secondary{color:var(--ink);background:var(--card);border:1px solid var(--border)}
  .btn-secondary:hover{border-color:var(--link);color:var(--link)}
