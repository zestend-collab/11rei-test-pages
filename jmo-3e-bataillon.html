<script>
// Chaque entree du journal est decoupee en blocs distincts (un bloc = un <p>, une <ul>, un
// <blockquote>...). La pagination assemble ensuite ces blocs automatiquement, page par page,
// a taille de police FIXE : jamais de mot coupe, jamais de changement brutal de taille.
// S'il y a plus de pages que dans le carnet original, ce n'est pas un probleme.
const blocks = [

`<div class="letterhead">
  <p class="regiment">JOURNAL DE MARCHE DU 3e BATAILLON</p>
  <p class="battalion">DU 11e RÉGIMENT ÉTRANGER</p>
</div>
<h2 class="doc-title">Reconstitué de mémoire<span class="doc-sub">pour la période du 10 mars au 23 juin 1940, par le Chef de Bataillon Gaultier, commandant le 1/2e Étranger — ex-commandant du 3/11e Étranger</span></h2>`,

`<p><span class="date">10 Mars</span> — Le Capitaine Gaultier, venant du 334e R.I., prend le commandement du Bataillon à Inglange (Moselle). Les consignes lui sont passées par le Capitaine Baron, Cdt la C.A.B.3, qui assure l'intérim depuis le départ du Capitaine Rio.</p>
<p class="pertes-title">Encadrement du Bataillon :</p>
<ul class="dispositif">
  <li>Bataillon : Capitaine Gaultier, Adjudant-Chef Trougnou — Médecin-Lieutenant Jagerschmidt, Auxiliaire Dejean (R)</li>
  <li>9e Cie : Capitaine Marguet, Lieutenant Jayet, Lieutenant Kakhovski (R) — Adjudant Pellegrini, Adjudant Liebuda, Adjudant Gorski</li>
  <li>10e Cie : Capitaine Trimaille, Lieutenant J. Dubois, Lieutenant Boudoux d'Hautefeuille, S/Lieutenant Garrigues — Adjudant-Chef Krantz, Adjudant Righes</li>
  <li>11e Cie : Lieutenant Beaumont, Lieutenant Levacher, Lieutenant David (R) — Adjudant Buschhaus, Adjudant-Chef Friedmann</li>
  <li>C.A.B.3 : Capitaine Baron, Lieutenant Binoche — Adjudant-Chef Viallon, Martinez, Siegenthaler</li>
</ul>
<p class="pertes-title">Stationnement du Bataillon :</p>
<ul class="dispositif">
  <li>P.C. et 10e Cie : Inglange (10 km S.-E. de Thionville)</li>
  <li>9e Cie et C.A.B.3 : Metrich</li>
  <li>11e Cie : Lemestroff</li>
</ul>
<p class="pertes-title">Stationnement du Régiment (Colonel Robert) :</p>
<ul class="dispositif">
  <li>P.C. et éléments régimentaires : Metzervisse</li>
  <li>1er Bataillon (Capitaine Rouillon) : Poudrerie de Gueling</li>
  <li>2e Bataillon (Capitaine d'Alegron) : Kalembourg-Sainte-Marguerite</li>
</ul>
<p>Le Bataillon a ses effectifs complets. Quelques permissionnaires. Le matériel auto est au complet et en très bon état. Le reste du matériel est à peu près au complet. Mais l'armement est médiocre : pas de fusil 36.</p>`,

`<p>L'état moral et sanitaire est bon. Les cantonnements sont : à Inglange — village non abandonné — étroits et médiocres ; à Lemestroff — village abandonné — sale et partagé avec des artilleurs ; à Metrich — village abandonné — satisfaisants et en voie d'amélioration.</p>
<p>Le Régiment, élément non endivisionné, est à la disposition du Corps d'Armée colonial (Général Freydenberg) pour des travaux défensifs de deuxième position. Territorialement le 3e Bataillon n'est pas stationné sur le même secteur que le Régiment et les deux autres Bataillons mais pratiquement il n'a rien à voir avec la D.I. d'occupation.</p>
<p>La région est calme ; sur la ligne des avant-postes quelques engagements des troupes au contact. Quelques survols d'avions allemands à très haute altitude, très peu d'avions français.</p>
<p>Le Bataillon travaille (sauf une ou deux journées par semaine réservées à l'instruction, en particulier à des tirs au stand du camp d'Elzange) aux organisations suivantes : éléments d'Inglange, barrage anti-chars de la rivière la Kanner ; petits bétons et abris à personnel dans les bois Sud d'Inglange ; Foyer du Soldat des troupes de forteresse stationnées à Inglange ; éléments de Metrich, brisant défensif du Klosterbusch (Est de Metrich) ; éléments de Lemestroff, brisant d'Oudrenne.</p>
<p>La rive intérieure du cours d'eau est équipée de poutrelles et de plaques de béton formant escarpement. La théorie des brisants se résume comme suit : la ligne Maginot, ligne principale de résistance, présente des trous et surtout est filiforme ; bien derrière elle, il convient d'empêcher le dispositif ennemi de buter sur elle sans l'avoir au préalable disloqué, d'où ces brisants, nids d'armes automatiques abrités par des plaques de béton (système Condé) et protégés par des réseaux.</p>`,

`<p><span class="date">17 Mars</span> — Rotation à l'intérieur du Bataillon.</p>
<ul class="dispositif">
  <li>P.C., S.C.B. et 9e Cie : Inglange</li>
  <li>10e Cie : Lemestroff</li>
  <li>11e Cie et C.A.B.3 : Metrich</li>
</ul>`,

`<p><span class="date">Mars</span> — Nouvelle rotation à l'intérieur du Bataillon.</p>
<ul class="dispositif">
  <li>P.C., S.C.B., 9e Cie et 11e Cie : Inglange</li>
  <li>10e Cie : Lemestroff</li>
  <li>C.A.B.3 : Metrich</li>
</ul>`,

`<p><span class="date">Avril</span> — À la suite de l'affectation de divers officiers, l'encadrement du Bataillon est réalisé comme suit :</p>
<ul class="dispositif">
  <li>Bataillon : Capitaine Gaultier, Lieutenant Boyer de Rebeval (R), Adjudant-Chef Trougnou, Adjudant-Chef Martinez — Médecin-Lieutenant Jagerschmidt, Médecin auxiliaire Dejean (R), Adjudant Liebuda</li>
  <li>9e Cie : Capitaine Marguet, Lieutenant Jayet, Lieutenant Kakhovski (R), Adjudant Pellegrini — Adjudant Gorski</li>
  <li>10e Cie : Capitaine Trimaille, Lieutenant J. Dubois, Lieutenant Boudoux d'Hautefeuille, S/Lieutenant Garrigues, Adjudant-Chef Krantz, Adjudant Righes</li>
  <li>11e Cie : Capitaine Lhuisset (R), Lieutenant Beaumont, Lieutenant Levacher, Lieutenant David (R), Adjudant Buschhaus — Adjudant-Chef Friedmann</li>
  <li>C.A.B.3 : Capitaine Baron, Lieutenant Binoche, Lieutenant Mossmann, S/Lieutenant Dadu (R) — Adjudant-Chef Viallon, Siegenthaler</li>
</ul>
<p>Le groupe franc du Bataillon — 1 groupe par compagnie de voltigeurs — se met sur pied et s'entraîne sous le commandement du Lieutenant d'Hautefeuille.</p>
<p>La 9e Cie stationne à Budling pour y travailler à des petits bétons dont la création a été décidée dans les intervalles de la ligne Maginot, au Nord-Ouest du camp de Veckring et de l'ouvrage du Hackenberg. Regroupement du Bataillon à Inglange.</p>`,

`<p><span class="date">Avril</span> — Préparatifs en vue d'un déplacement par voie ferrée qui doit avoir lieu à partir du 14. Embarquement à Hagondange, où les bagages commencent à être stockés. Le Régiment, retiré au C.A.C. et transporté dans la région de Bar-le-Duc, doit être endivisionné dans une formation de création récente avec le 12e Régiment étranger et un régiment d'infanterie.</p>`,

`<p><span class="date">Avril</span> — Contre-ordre. À partir de 17 heures, mouvement par voie de terre. Itinéraire : Buding — Elzing — Kédange — Hombourg — Budange — Eberswiller — Hestroff.</p>`,

`<p><span class="date">Avril</span> — Le Bataillon relève le 3e Bataillon de chasseurs qui stationne à Anzeling (3 km Sud-Ouest de Bouzonville), village abandonné, spacieux et agréable. Installation et regroupement des bagages.</p>`,

`<p><span class="date">Avril</span> — Le 11e Étranger, affecté à la 6e D.I.N.A. (Général de Verdilhac), y remplace la 1/2e Brigade de chasseurs du Colonel Laffargue, désignée pour la Norvège.</p>
<p class="pertes-title">Stationnement du Régiment :</p>
<ul class="dispositif">
  <li>P.C. : ferme de Saint-Michel, sur la route Bouzonville-Freistroff-Metz</li>
  <li>1er Bataillon : Diding</li>
  <li>2e Bataillon : Piblange</li>
  <li>3e Bataillon : Anzeling</li>
</ul>`,

`<p><span class="date">Avril</span> — L'organisation du secteur est schématiquement la suivante : en ligne les éléments de couverture (dont le 1/11e), aux ordres du Colonel François, commandant l'I.D. — P.C. à Holling — sont renforcés par tous les groupes francs de la D.I. (sous le commandement du Capitaine de Dampierre). Organisation d'une D.C.A.</p>
<p>Travaux au brisant d'Anzeling — Est du village — constitué essentiellement par un fossé anti-chars. Mise en route sur Alzing du groupe franc du Bataillon. Reconnaissances diverses des cadres en vue de l'étude des contre-attaques prévues pour le Bataillon, en particulier vers Hayes — Glatigny — les Étangs — Noirefontaine — Zondrange.</p>
<p>Travaux. En raison du manque d'effectifs pour les tenir, l'idée des brisants est abandonnée, sauf pour quelques-uns essentiels, à la suite d'une conférence de généraux dans le bois d'Anzeling. Le Bataillon travaille alors avec le 2e Bataillon au fossé anti-chars à l'Est du camp de Bockange.</p>
<p>La 6e D.I.N.A. est relevée pour faire des travaux dans la région de Metz-Pagny-sur-Moselle. Mais le 11e Étranger reste sur place en réserve de Corps d'Armée et aux travaux. Les groupes francs sont maintenus en ligne et ont une grosse activité, surtout de nuit ; pour le Bataillon, dans la région célèbre de la chapelle de « Paris-Soir » — un sergent et un légionnaire sont blessés.</p>`,

`<p><span class="date">Avril</span> — Dans la nuit du 21 au 22 avril, mouvement par voie de terre. Itinéraire : Gomelange — Bettange — Eblange — Ruppeldange — Boulay.</p>`,

`<p><span class="date">Avril</span> — Le Bataillon s'installe dans les casernements du camp du Ban Saint-Jean (4 km Sud-Est de Boulay). Il est mis à la disposition d'une D.I. de formation pour réfection et agrandissement d'un fossé anti-chars entre Oberwisse et Niederwisse.</p>`,

`<p><span class="date">Avril</span> — Stationnement du Régiment :</p>
<ul class="dispositif">
  <li>P.C. R.I. : Condé-Northen</li>
  <li>1er Bataillon : camp de Bockange</li>
  <li>2e Bataillon : Volmerange</li>
  <li>3e Bataillon : camp de Ban Saint-Jean</li>
</ul>
<p>Ces cantonnements sont sur les secteurs territoriaux de diverses divisions en ligne.</p>`,

`<p><span class="date">Avril</span> — Travaux anti-chars.</p>`,

`<p><span class="date">Avril</span> — Célébration brillante de la fête de Camerone à Boulay. Prise d'armes avec remise du drapeau. Défilé impeccable en présence de nombreux généraux. Messe — réjouissances.</p>
<p>Travaux anti-chars.</p>`,

`<p><span class="date">Mai</span> — Étude d'une contre-attaque avec chars vers Zimming. Le groupe franc poursuit son activité.</p>`,

`<p><span class="date">Mai</span> — L'alerte tient à partir de 4 heures, tout le monde éveillé ; survol d'avions, bombardement du terrain d'aviation de Metz. Dans la fièvre chacun attend l'ordre de mouvement ; le moral est extraordinaire ; chacun ronge son frein de ne pas être en ligne où les Allemands bombardent fortement les avancées de la ligne Maginot. Grande activité des groupes francs.</p>`,

`<p><span class="date">Mai</span> — Travaux anti-chars.</p>`,

`<p><span class="date">Mai</span> — Travaux anti-chars. Le Bataillon est alerté vers 17 heures.</p>`,

`<p><span class="date">Mai</span> — Entre 2 et 10 heures, le Bataillon se déplace par voie de terre en assurant sa D.C.A. Itinéraire : Macher — Helstroff — Courcelles — Chaussy — Chevillon.</p>
<ul class="dispositif">
  <li>P.C., 10e Cie, C.A.B.3 : Maizeroy</li>
  <li>9e Cie : Berlize</li>
  <li>11e Cie : Frécourt</li>
</ul>
<p>Le P.C. R.I. est à Pangé. Grosse activité d'aviation surtout nocturne dans la région ; rien de local. À partir de 21 heures le Bataillon est embarqué en camions ainsi que le P.C. R.I. et la C.R.E. Les autres éléments du Régiment partent par voie de terre. Le Bataillon embarque le personnel, l'armement et les voiturettes. Les équipages partent par la route avec les autres bataillons. Les bagages lourds sont stockés à Pouilly (Sud de Metz).</p>`,

`<p>La 6e D.I.N.A. qui stationnait dans la région de Metz a été alertée et dirigée vers le Nord-Ouest en direction de la Meuse. Après une nuit passée en camions sur l'itinéraire Pangé — Metz — Étain —, le Bataillon est débarqué vers 9 heures — sans incidents malgré quelques survols d'avions — à Haudelaincourt, 2 km Sud-Est de Spincourt. P.C. R.I. à Vaudoncourt.</p>
<p>La route suivie porte les traces de bombardements récents. Le défilé quasi ininterrompu des Lorrains qui fuient devant l'invasion est poignant.</p>
<p>Reconnaissance du Commandant du Bataillon accompagnant le Colonel au P.C. d'un régiment de forteresse. Le groupe franc du Bataillon, relevé après être intervenu pour dégager les avant-postes fortement pressés à l'Est de Bouzonville, rejoint en camion.</p>
<p>Le Lieutenant Jayet, nommé Capitaine à titre temporaire à la date du 1er mai, prend le commandement de la 9e compagnie. Le Capitaine Marguet prend les fonctions de Capitaine Adjudant-Major. Le Lieutenant d'Hautefeuille fait du service à la 9e Cie.</p>
<p>Reconnaissance des cadres en vue de l'occupation et de l'organisation d'une bretelle, et de la préparation d'une contre-attaque vers Sorbey, le bois de Rafour, le Grand Failly. Travaux locaux de D.C.A. Reconnaissance du Capitaine commandant le Bataillon, accompagnant le Colonel vers la Meuse (région Ouest de Damvillers).</p>`,

`<p>Déplacement par voie de terre à partir de 20 heures. Itinéraire : Vaudoncourt — Billy — Mangiennes — Romagne-sous-les-Côtes — Damvillers. Le Bataillon s'installe dans le bois d'Écurey. La Division est rejointe.</p>
<ul class="dispositif">
  <li>P.C. R.I. : bois de Bréhéville</li>
  <li>1er Bataillon : Brandeville</li>
  <li>2e Bataillon : Bréhéville</li>
  <li>3e Bataillon : Écurey</li>
</ul>
<p>Le Régiment, encadré à droite par le 9e R.T.M., à gauche par le 21e R.T.A., est chargé d'organiser et d'occuper une position de repli. Les travaux commencent dans la nuit ; à l'Est d'Écurey, la 10e Cie (avant-postes) ; à l'Ouest d'Écurey (bois), le reste du Bataillon.</p>
<p>Travaux. Travaux.</p>`,

`<p>Ordre de monter en ligne pour relever, dans la région Nord de Stenay où la canonnade presque ininterrompue est violente, la 3e D.I.N.A. épuisée qui, ayant incorporé dans ses rangs les éléments épars de deux autres divisions, ne contient plus que péniblement la poussée allemande.</p>
<p>Mise en route à 20 heures par voie de terre. Itinéraire : Écurey — Lissey — Bréhéville — Brandeville — Charmois — Mouzay. Surpris par le jour, le Bataillon doit se réfugier dans un petit bois au Sud de Baalon sans avoir pu atteindre comme prévu le bois de Pâques (Nord de Baalon) où s'est installé le P.C. R.I.</p>
<p>L'après-midi, reconnaissances du Chef de Bataillon et d'un détachement de chaque compagnie (1 officier, quelques sous-officiers). La situation est confuse dans le bois d'Inor où le 3e Bataillon doit s'installer, partie en ligne, partie en soutien.</p>
<p>Malgré le danger aérien, mise en route vers 19 heures. Traversée sans incidents, malgré que le terrain soit absolument nu, de Baalon, du château de Brouelle. Par les lisières Ouest du bois de Nepvant, le Bataillon continue sa route. La nuit est venue. Il faut d'ailleurs prendre la suite d'un bataillon de tirailleurs.</p>`,

`<p class="poignant">Vers 23 heures, passage à la ferme d'Heurtebise sur le chemin Martincourt-Olizy qu'emprunte le Bataillon pour pénétrer dans le bois du Ligant. Se déclenche alors un violent tir d'artillerie qui ne cessera plus de la nuit et causera de fortes pertes en raison de l'entassement sous bois des éléments relevés et des éléments relevants.</p>
<p>Dans le plus grand désordre s'opèrent la relève et la mise en place du Bataillon. Sur tous les sentiers, dans le noir le plus complet, c'est un imbroglio d'hommes, d'animaux, de voiturettes. L'emplacement des postes de secours est ignoré. Il y a des blessés, des cadavres d'hommes et d'animaux. Il est pendant un long moment impossible d'avancer.</p>`,

`<p>Au jour cependant, ayant relevé des éléments du 14e R.T.A. renforcés par des fractions de zouaves, de coloniaux, de fantassins, le Bataillon est en place.</p>
<p>En première ligne, à droite du sous-secteur du Régiment et en liaison avec le 9e R.T.M., la 10e Cie tient sur 1200 mètres un bois en losange et la lisière Nord du bois du Ligant, face au bois de Neudant et à la cote 311 de Malandry. Renforcée par une section de mitrailleuses et les canons de 25 de la C.A.B.3, elle intègre dans son dispositif le P.C. et une section de mitrailleuses du 1er Bataillon.</p>
<p>À sa gauche, en soutien sur 1500 mètres, la 11e Cie derrière les fronts des 1er et 2e bataillons qui forment une hernie face au Nord. Cette unité, renforcée d'une section de mitrailleuses de la C.A.B.3, barre le bois d'Inor d'Est en Ouest et assure la liaison à gauche avec des éléments du 21e R.T.A.</p>
<p>Derrière la 11e Cie, le P.C. du 3e Bataillon avec la 9e Cie, deux sections de mitrailleuses, la section de mortiers de la C.A.B.3 et le poste de secours du Bataillon qui, renforcé par des éléments régimentaires, va servir de relais pour les évacuations et fournir de jour comme de nuit un travail très pénible. Le P.C. R.I. est à deux kilomètres en arrière. Cuisines et T.R. sont au château de Brouelle.</p>
<p>Les relevés, très fatigués, nous ont passé des consignes très sommaires.</p>`,

`<p>Il faut tenir sans esprit de recul. Les Allemands arrosent copieusement les bois et par suite nos positions avec des canons rapides (88, 100), avec du calibre plus important (150, 210), avec surtout des mortiers très mobiles. Leur aviation nous survole sans arrêt mais grâce aux bois voit peu. Cependant jour après jour les futaies vont s'éclaircir sous l'effet des bombardements.</p>
<p>Pendant 48 heures c'est un défilé incessant d'isolés qui se replient, de corvées qui viennent rechercher le matériel oublié au moment de la relève. Nous avons trouvé sur place de nombreuses armes abandonnées dont nous nous emparons et nous servons (la 10e Cie récupère ainsi 7 F.M.). En revanche peu de munitions ; mais nos chenillettes fonctionnant sans arrêt vont nous en apporter ainsi que des outils et du fil de fer barbelé.</p>
<p>Partout des cadavres d'hommes et d'animaux ; il faut enterrer, assainir ; on s'y emploie activement. Les organisations définitives sont sommaires ou même inexistantes ; quelques trous individuels peu profonds derrière un réseau filiforme genre barrière à vaches et présentant des solutions de continuité. Les hommes fournissent un gros travail et rapidement la position prend tournure.</p>`,

`<p>À droite toutefois la 10e Cie, qui tient le coin le plus exposé et où les pertes seront les plus fortes parce qu'en partie hors des bois et à la charnière avec le 9e R.T.M. — charnière sur laquelle semblent s'acharner les Allemands, peut-être parce qu'ils pressentent notre idée de nous emparer de la cote 311 —, ne peut guère travailler que la nuit.</p>
<p>Notre artillerie (calibres très variés) fait d'ailleurs jeu égal avec les Allemands ; elle est même peut-être plus nombreuse et les surclasse. Mais nous n'avons pas d'aviation. Nos hommes, nerveux la première nuit, seront vite maîtres de leurs nerfs et, d'ailleurs, plus confiants derrière leurs réseaux, cesseront rapidement leurs tirailleries.</p>`,

`<p>Il est indéniable que surtout la nuit les patrouilles allemandes sont très actives et s'infiltrent très adroitement. Nos prédécesseurs en avaient paru terrorisés et ils nous ont transmis concernant ce bois d'Inor des légendes qu'entretiennent le mystère et les incidents des premières nuits : balles traceuses, fusées, signaux acoustiques (dont beaucoup sont des cris d'animaux et probablement réels), irruptions de sangliers dans les réseaux.</p>
<p>Les patrouilleurs allemands sont munis de mitraillettes ; ils paraissent connaître l'essentiel de nos organisations mais cherchent à nous faire dévoiler. Ils semblent procéder de la façon suivante : certaines rafales de balles traceuses déclenchent des bombardements locaux courts mais très denses et il y a d'assez nombreux et coûteux coups au but.</p>
<p class="poignant">Les pertes jour après jour sont lourdes. Les documents à ce sujet ont dû être détruits mais elles doivent approcher pour le Bataillon de 10 tués et 20 blessés par jour calme. Quelques animaux également.</p>
<p>Les arrières sont touchés eux aussi, en particulier les cuisines. Et le ravitaillement, prévu par percolateurs dans la deuxième partie de chaque nuit, n'est que médiocre.</p>`,

`<p class="pertes-title">À noter :</p>
<p>Tentatives de grosses patrouilles allemandes sur la droite de la 10e Cie à la fin de la nuit. Elles sont repoussées laissant des morts sur le terrain.</p>
<p>Repli de la 9e Cie qui passe en réserve d'I.D. sur la ligne d'arrêt, à proximité du P.C. R.I., le long du chemin Martincourt-Olizy. La section Levacher de la 11e Cie, envoyée en renfort à la 7e Cie, prend un créneau en ligne le long de la route Inor-Malandry.</p>
<p>La cuisine roulante de la 10e Cie est détruite au cours d'un bombardement qui provoque l'évacuation d'un assez nombreux personnel des T.C. et T.R. La section de mitrailleuses Mossmann (à la disposition de la 10e Cie) subit d'assez fortes pertes.</p>`,

`<p>L'artillerie allemande intensifie son tir. Le Lieutenant Dubois, blessé, est évacué. Le P.C. Bataillon, repéré par un avion, subit un violent bombardement ; nombreux blessés dont l'Adjudant-Chef Trougnou et trois sous-officiers. Sous le bombardement la futaie s'est éclaircie ; le P.C. est reporté pendant la nuit à 150 mètres en arrière.</p>
<p>Des Allemands vêtus de noir ont été vus à 311 et des bruits de moteur sont entendus. Les canons de 25 sont poussés vers la droite de la 10e Cie qui subit un violent bombardement : deux pièces de mitrailleuses sont détruites. Les emplacements sont retournés par des coups de 210 : des blessés et des morts sont enterrés par le bombardement.</p>
<p>La 9e Cie a aussi des pertes provenant des tirs systématiques sur le P.C. et le poste de secours du Régiment. L'artillerie allemande intensifie encore et ajuste ses tirs surtout sur la 10e Cie.</p>
<p>Une section de la 11e Cie renforce la 10e Cie dont le dispositif est remanié. Un bombardement violent met cette section presque en entier hors de combat ; un groupe de combat de la 11e Cie vient prendre sa place (en particulier le chef de section, l'Adjudant-Chef Friedmann).</p>
<p>La section de mitrailleuses Mossmann, bien que renforcée, a de telles pertes (dont le lieutenant évacué) qu'il faut la remplacer par un nouveau groupe de mitrailleuses. On signale des infiltrations à la lisière Sud du bois de Neudant. La nuit commence dans le calme.</p>`,

`<p class="pertes-title">L'encadrement est alors le suivant :</p>
<ul class="dispositif">
  <li>Bataillon : Capitaine Gaultier, Capitaine Marguet (Adjudant-Major), Lieutenant David, Lieutenant Kakhovski (T.R.) — Médecin-Lieutenant Jagerschmidt, Médecin auxiliaire Dejean — Adjudant-Chef Viallon, Adjudant-Chef Martinez (approvisionnement), Adjudant Pellegrini (vaguemestre)</li>
  <li>9e Cie : Capitaine Jayet, Lieutenant d'Hautefeuille — Adjudant Liebuda, Adjudant Gorski</li>
  <li>10e Cie : Capitaine Trimaille — Adjudant Righes, S/Lieutenant Garrigues</li>
  <li>11e Cie : Capitaine Lhuisset, Lieutenant Beaumont, Lieutenant Levacher — Adjudant Buschhaus</li>
  <li>C.A.B.3 : Capitaine Baron, Lieutenant Binoche, S/Lieutenant Dadu — Adjudant-Chef Siegenthaler</li>
</ul>`,

`<p class="poignant"><span class="date">27 Mai</span> — Vers 3 heures les Allemands déclenchent un très violent bombardement sur les positions de la Division (sur le front du 11e Étranger en particulier) et sur les arrières. Alertée à la suite de renseignements fournis par un déserteur fait prisonnier la veille ou l'avant-veille (renseignements non diffusés jusqu'à l'échelon Bataillon), notre artillerie déclenche rapidement une contre-préparation que l'on saura par la suite avoir été très efficace.</p>
<p>Au jour les Allemands attaquent. Après diverses alternatives ils sont repoussés, sauf à la droite du 2e Bataillon où la 5e Cie se replie sous bois de quelques centaines de mètres, laissant la porte ouverte aux infiltrations.</p>`,

`<p class="pertes-title">Des contre-attaques :</p>
<ul class="dispositif">
  <li>a. des éléments disponibles du 2e Bataillon</li>
  <li>b. de la 9e Cie (en réserve), à partir de midi</li>
  <li>c. des deux sections disponibles de la 11e Cie, qui nettoieront les bois aux ordres du Capitaine Lhuisset</li>
</ul>
<p class="pertes-title">Pertes de la 9e Cie :</p>
<ul class="pertes">
  <li>14 tués, dont l'Adjudant Gorski et 4 sous-officiers</li>
  <li>20 blessés, dont le Lieutenant d'Hautefeuille</li>
  <li>12 disparus</li>
</ul>
<p>Des éléments disponibles du Régiment remplacent sur la ligne de soutien les éléments du 3e Bataillon, tous engagés.</p>
<p>À droite, sur le front de la 10e Cie, la journée a été plus calme ; les tentatives d'infiltration vers le bois du Ligant, prononcées à 9 heures, ont été refoulées.</p>`,

`<p>C'est dans le bois d'Inor que le combat a été violent. Le Régiment s'y est bien comporté. Il a arrêté une division allemande. Le soir notre position est à peu près intégralement reconstituée. Le Régiment est chaudement félicité.</p>
<p class="poignant">Mais la journée a coûté assez cher, même sur les arrières où l'Adjudant-Chef Martinez a été blessé et évacué. Le 3e Bataillon a perdu en 7 jours tous ses sous-officiers chefs de service.</p>
<p>Quand le combat cesse un calme inaccoutumé tombe sur ce bois d'Inor.</p>`,

`<p>Un ordre parvenu pendant la nuit prescrit un léger repli avant le jour, afin de supprimer la hernie que faisait vers le Nord le sous-secteur du Régiment qui, s'alignant sur la corde de l'axe, doit installer sa première ligne là où se trouvait la veille la 11e Cie en soutien, sensiblement sur la laie forestière Inor-Olizy.</p>
<p>Le front sera incontestablement moins étendu et c'est sans doute utile après les pertes du 27 mai. Mais quels regrets pour les légionnaires vainqueurs d'abandonner leurs lignes qu'ils avaient installées et tant de munitions.</p>
<p>Les ordres sont difficiles à transmettre. Mais l'ennemi n'ayant aucune réaction, vers 8 heures le Bataillon est en place en ligne, à la gauche du sous-secteur du Régiment, en liaison à droite avec le 1er Bataillon (le 2e Bataillon étant passé en réserve), à gauche avec le 21e R.T.A.</p>`,

`<p>À droite la 10e Cie occupe les anciens emplacements de la 11e Cie ; elle a son centre au carrefour d'une grande laie centrale Nord-Sud qui coupe en deux le bois d'Inor et du chemin Inor-Olizy. Elle est renforcée par la section de mitrailleuses. À gauche la 9e Cie, renforcée par une section de mitrailleuses. Derrière la 9e Cie en soutien : la 11e Cie.</p>
<p>Le Bataillon a dû céder son P.C. au 1er Bataillon et vient s'installer à 800 mètres à l'Ouest-Sud-Ouest, près d'une autre grande laie Nord-Sud, à 500 mètres en arrière de la 11e Cie. Il a avec lui les deux canons de 25, les mortiers et la dernière des sections de mitrailleuses de la C.A.B.3 (réduite à 3 sections).</p>
<p>Le S/Lieutenant Garrigues, blessé grièvement, est évacué ainsi que quelques légionnaires. Les pertes sont continues mais à une cadence plutôt plus faible. Les travaux recommencent pour aménager les nouvelles positions qui arriveront cette fois à être presque continues. On recommence les stocks de munitions. Le P.C. R.I. s'est replié dans le bois de Nepvant.</p>`,

`<h2 class="doc-title">29 mai – 1er juin<span class="doc-sub">Période stable</span></h2>
<p>Activité quotidienne sur le front du Bataillon :</p>
<p class="pertes-title">a. Allemands :</p>
<ul class="dispositif">
  <li>Survols d'avion sans résultat d'ailleurs en raison de l'épaisseur des bois</li>
  <li>Bombardement de minen</li>
  <li>Patrouilles de contact</li>
  <li>Quelques reconnaissances en force</li>
  <li>Rectifications de lignes et travaux</li>
</ul>
<p class="pertes-title">b. Nous :</p>
<ul class="dispositif">
  <li>Travaux</li>
  <li>Très nombreuses patrouilles de contact</li>
  <li>Plusieurs reconnaissances</li>
</ul>`,

`<p class="pertes-title">Faits saillants — A. Encadrement</p>
<p><em>Nominations :</em> 1er juin, Capitaine Gaultier, chef de bataillon à titre temporaire ; Adjudant-Chef Viallon, sous-lieutenant à titre temporaire ; Adjudant Rayewski, sous-lieutenant à titre temporaire.</p>
<p><em>Affectations :</em> 30 mai, Lieutenant David — adjoint — à la 10e Cie ; 2 juin, Lieutenant Levacher, de la 11e Cie à la 10e Cie ; Adjudant Rayewski, nommé adjudant de bataillon puis chef de section à la 11e Cie ; S/Lieutenant Dadu, puis Adjudant-Chef Viallon, chefs de section à la 9e Cie.</p>
<p><em>Évacuations :</em> Lieutenant David, malade le 2 juin ; Lieutenants Levacher, de Rebeval, S/Lieutenant Dadu, blessés.</p>`,

`<p class="pertes-title">B. Rectification de lignes</p>
<p>31 mai : la 9e Cie passe en soutien ; la 11e Cie passe en ligne, à la gauche du quartier, en liaison avec le 3/21e R.T.A.</p>
<p>5 juin : les engins sont portés sur la ligne des soutiens.</p>
<p>9 juin : le 2e Bataillon devant s'étendre sur la droite pour prendre à sa charge une partie du sous-secteur du 9e R.T.M., la 10e Cie, renforcée par une nouvelle section de mitrailleuses, s'étend sur sa droite. Le P.C. Bataillon se porte sur la ligne des soutiens, 1 km en avant de son emplacement.</p>`,

`<p class="pertes-title">C. Mouvements dans le personnel régimentaire et le stationnement du 11e Étranger</p>
<p>Le Colonel Robert prend le commandement de l'I.D. Le Commandant Clément prend le commandement du 11e Étranger.</p>
<p>Vers le 4 juin, le 1er Bataillon passe en réserve et est remplacé en ligne à la droite du sous-secteur du Régiment par le 2e Bataillon. Même mouvement dans la compagnie soutien à la gauche du Bataillon : la 7e Cie est relevée par la 3e Cie.</p>`,

`<p class="pertes-title">D. Activité de guerre</p>
<p>Après un coup de main d'une compagnie qui échoue sur la 10e Cie dans la nuit du 28 au 29 mai (vers 2 heures du matin), les Allemands restent passifs jusqu'au 3 juin, se bornant à s'opposer au travail de nos patrouilles qui, en dépit de leur fréquence, ne parviennent ni à faire un prisonnier (malgré l'insistance du Général commandant la Division), ni à déterminer l'importance de l'occupation de la première ligne allemande, ni à dépasser cette ligne.</p>
<p>Le Capitaine Trimaille, Cdt la 10e Cie, les Lieutenants Beaumont et Levacher (avant d'être blessés), quelques sous-officiers et légionnaires se distinguent particulièrement pendant cette période et fournissent un effort extraordinaire d'autant plus méritoire que la vie sous bois, telle qu'elle est menée, surtout après plus de deux semaines en ligne dans un secteur agité, est très déprimante.</p>
<p>À partir du 3 juin, les Allemands réagissent et font jeu égal avec nos patrouilles, leur ligne de surveillance dont le contact a été bien pris et le dessin bien déterminé ayant été probablement renforcée. Il faut alors agir plus prudemment : embuscades de nuit ou de jour d'un gradé et de deux hommes, patrouilles très faibles qui ne progressent qu'en rampant, ou, plus en force, reconnaissances de compagnie.</p>
<p>D'ailleurs, au fur et à mesure que les Allemands recommencent à être plus actifs, nos hommes, fatigués, nerveux, surpris à diverses reprises, perdent un peu courage ; il y a moins de volontaires ; quelques pièges placés par les Allemands augmentent les inquiétudes.</p>`,

`<p class="pertes-title">E. De cette période, il faut citer :</p>
<p><strong>29 mai</strong> — Vers 2 heures du matin, un coup de main allemand échoue sur la 10e Cie. Il est mené par une compagnie. Peut-être d'ailleurs n'est-ce qu'une reconnaissance, ou même un élément chargé d'installer des avant-postes ! Quoi qu'il en soit, dans la nuit d'encre qui règne sous bois, cet élément butte sur nos réseaux vers 2 heures du matin. Quelques rafales de pistolet-mitrailleur déclenchent notre tir de barrage général qui entraîne un repli d'ailleurs bruyant des Allemands. Lorsque le tir est levé on les entend : ils travaillent. Alertée, notre artillerie reprend ses tirs et les Allemands refluent.</p>
<p>Au jour, des patrouilles enterrent les morts allemands et ramènent de nombreuses armes dont trois mitrailleuses, des munitions et des documents.</p>
<p><strong>30 au 31 mai</strong> — Coup de main de la 9e Cie, sans résultat.</p>
<p><strong>Nuit du 8 au 9 juin</strong> — Coup de main de la 10e Cie et d'éléments de la 9e Cie, sans résultat.</p>`,

`<p><strong>9 juin</strong> — Sortie à l'improviste (pour agir en liaison avec un coup de main du 21e R.T.A.) d'une grosse patrouille de la 10e Cie aux ordres du capitaine. Elle échoue de justesse. Journée assez calme — des ordres sont donnés pour renforcer l'action des patrouilles.</p>
<p>À l'Ouest, la division voisine (coloniale) continue à soutenir des combats qui paraissent violents. Dans le détail il semble qu'elle ait perdu un peu de terrain. Les E.R.40 du Bataillon à l'écoute continuent à capter de nombreuses liaisons radio-aériennes d'observateurs allemands réglant, dirigeant, ordonnant des tirs sur des mouvements de troupes.</p>`,

`<p>Au milieu de l'après-midi, le Chef de Bataillon, convoqué au P.C. R.I., reçoit l'ordre imprévu de décrochage qui sera effectué la nuit avec le maximum de précautions. Une section par bataillon restera sur place jusqu'à la prime aube et fera le maximum de volume afin de donner le change à l'ennemi qui doit ignorer notre mouvement le plus longtemps possible. Section désignée : Lieutenant Beaumont, de la 11e Cie.</p>
<p>Le 3e Bataillon doit tenir après le repli prévu de quelques kilomètres le sous-secteur du Régiment pendant que le premier Bataillon, déjà en route, et le 2e Bataillon organiseront des lignes d'arrêt plus en arrière.</p>
<p class="poignant">Le personnel a la mort dans l'âme mais le mouvement s'exécute normalement par sections successives et dans le silence à partir de 21 heures.</p>
<p>Avant de partir, les armes en excédent ont été détruites ; quelques munitions sont repliées mais nous en laissons sur place d'assez fortes quantités ; des grenades dégoupillées sont placées dans les caisses de munitions.</p>`,

`<p><span class="date">Juin</span> — La nuit est calme. Le Bataillon repasse à la ferme d'Heurtebise et vers 2 heures du matin il est installé sur les lisières Nord et Nord-Est du bois de Nepvant ; de gauche à droite : la 9e Cie, en liaison avec le 3/21e R.T.A., la 10e Cie, la 11e Cie, en liaison avec le 3/9e R.T.M. La section Beaumont rejoint au jour sans incident.</p>
<p>L'I.D., qui commande les trois bataillons en ligne, est installée au château de Brouelle. Les batteries d'artillerie en position dans le bois de Nepvant ont été repliées ; mais les échelons essaient de récupérer une faible partie des gros stocks d'obus que notre repli nous oblige à abandonner. L'impression est pénible ; les installations réalisées ont été évacuées en désordre et déjà les cœurs sont étreints.</p>`,

`<p>Matinée sans incident utilisée à parfaire les organisations de fortune (emplacements d'armes automatiques, abris individuels) commencées pendant la nuit, les hommes se relayant afin de se reposer ; l'ennemi paraît cependant s'apercevoir de notre repli dans la matinée, probablement parce qu'à notre droite le terrain est moins boisé ; il recherche le contact, d'ailleurs assez prudemment. Mais les bombardements reprennent à 14 heures sur les lisières que nous occupons, et à 16 heures le contact est repris.</p>
<p>Dans la soirée, un petit poste de la 9e Cie est surpris et ne peut se replier qu'en partie. Le Bataillon recueille un officier et deux sous-officiers du parc de Stenay qui, non prévenus du repli et préparant un ravitaillement nocturne, sont tombés sur les lignes allemandes et ont dû abandonner leur voiture. Pas de ravitaillement ; consommation de vivres de réserve.</p>`,

`<p>Nouvel ordre de décrochage pour passer derrière la ligne d'arrêt en cours d'installation dans la forêt de Woëvre. Le mouvement s'exécute comme la veille, à la nuit tombée. La croûte laissée cette fois-ci est d'une section par compagnie : 9e Cie, section Viallon ; 10e Cie, section Rayewski ; 11e Cie, section Beaumont. L'ensemble aux ordres du Capitaine Adjudant-Major Marguet, qui doit décrocher deux heures plus tard et assurer la destruction des ponts de Baalon avec les éléments du Génie qui préparent le travail.</p>
<p>Regroupement du Bataillon au château de Brouelle. Bombardement avant d'entrer à Baalon où le Chef de Bataillon cherche en vain à être orienté. La nuit est noire.</p>`,

`<p><span class="date">Juin</span> — Vers 1 heure du matin, le Chef de Bataillon arrête le Bataillon dans la partie Nord de la forêt de Woëvre. Il a cru dépasser une vague ligne d'arrêt, mais inoccupée. Aucun contact n'a pu être établi avec qui que ce soit. Pas de carte, pas de point de destination très précis ; pas de nouvelles des sections laissées dans le bois de Nepvant. Vers le Nord, quelques bombardements, des explosions de ponts qui sautent.</p>
<p>On attendra le jour. Gros orage. Pas de ravitaillement.</p>
<p>Au petit jour, le Bataillon, toujours privé des trois sections « de croûte », se rabat, non sans mal, sur la route Stenay-Juvigny par où se replient des tirailleurs de la Division. Par bonheur, le plafond nuageux est bas et il n'y a pas de survol d'avion.</p>
<p>Vers 10 heures, le Régiment, sauf le 2e Bataillon, se recolle dans le bois à quatre kilomètres Sud-Ouest de Juvigny-sur-Loison. Ravitaillement réduit.</p>`,

`<p>Le 3e Bataillon reçoit l'ordre de se diriger d'urgence sur la région de Dun-sur-Meuse, Milly, Lion-devant-Dun, et d'y relever un G.R. de Corps d'Armée de réserve qui tient les passages de la Meuse.</p>
<p>Nouvelle marche rapide et excessivement pénible. Vers 15 heures le Bataillon est regroupé à la lisière Sud-Ouest des bois au pied de la côte Saint-Germain, sur laquelle le Chef de Bataillon compte s'installer avec la 10e Cie pendant que les 9e et 11e Cies iront relever le G.R.</p>
<p>Malgré la fatigue les reconnaissances commencent aussitôt ; à Lion-devant-Dun le Commandant rencontre le Cdt du G.R. qui le met au courant de la situation : sur la rive gauche de la Meuse la menace de débordement se précise ; de plus en plus pressée et isolée, la division coloniale combat mais cède du terrain. Le G.R. se repliera sur Verdun la nuit.</p>
<p>Pendant que les commandants de compagnie poursuivent leurs reconnaissances afin de se placer, dès la nuit venue, le Commandant regagne les bois près de la côte Saint-Germain et y trouve le P.C. R.I.</p>`,

`<p>La 3e D.I.N.A., que nous avions relevée trois semaines auparavant, doit prendre notre place et nous allons être enlevés en camions pour être transportés sur le front de Champagne.</p>
<p>Le Capitaine Marguet, retardé parce que les ponts ont sauté avant son passage, rejoint avec deux sections ; il manque encore la section Viallon qui rejoindra peu après. Nos cuisines, sauf celles de la 9e Cie, sont restées dans le bois du Charmois et sont considérées comme perdues. Ravitaillement sur le pays.</p>
<p>Non sans mal, les reconnaissances sont rappelées. À un soleil brûlant succède une pluie d'orage glacée.</p>
<p>Nouveau contre-ordre — c'est la 3e D.I.N.A. qui est embarquée en camions. Le repli continuera par voie de terre ; objectif à atteindre pendant la nuit : le bois des Caures.</p>`,

`<p>Étape fort pénible par Bréhéville — Brandeville — Écurey — Damvillers. Les hommes sont fatigués, ils ont peu mangé ; les routes sont encombrées ; à Damvillers, c'est un embouteillage indescriptible.</p>
<p>Le Bataillon traverse Ville-devant-Chaumont et s'installe en position défensive dans la partie Est du bois des Caures. Le P.C. R.I. est près du monument Driant. L'ordre arrive d'un nouveau repli pendant la nuit pour regroupement dans la région de Verdun.</p>`,

`<p><span class="date">Juin</span> — Le mouvement commence peu après minuit. Des éléments de toutes armes empruntent la route et la cohue risque de couper le Bataillon qui est souvent obligé de progresser en colonne par un sur les bas-côtés. À l'Ouest, le combat paraît s'approcher du Mort-Homme, de Cumières, de Chattancourt.</p>
<p>Au jour, nous sommes sur la route Stenay-Verdun, que nous quittons à Bras pour gagner Douaumont. Arrêt en vue de s'organiser défensivement au ravin de la Caillette. Le P.C. Bataillon est à proximité de l'auberge de Douaumont. Repos sur place dans les bois à proximité de la route.</p>`,

`<p>Vers midi le Bataillon et la C.R.E. sont embarqués en camions, sans les équipages qui rejoindront par la route. Par bonheur, aucun survol d'avions. Destination : Spada. Mission : défense des fronts de la Meuse gardés seulement par quelques éléments d'un régiment régional. Itinéraire : Douaumont — Fleury — Verdun (faubourg pavé) — Fresnes-Saint-Maurice — Deuxnoud-aux-Bois.</p>
<p>Sur la route de Metz, à quelques kilomètres de Verdun, le convoi est survolé d'assez haut par des avions italiens et reçoit des bombes de petit calibre — quelques voitures sont atteintes — quelques pertes. Spada est atteint vers 17 heures.</p>`,

`<p class="pertes-title">Organisation défensive réalisée :</p>
<ul class="dispositif">
  <li>11e Cie : Maizey</li>
  <li>10e Cie et C.R.E. : Spada, avec une section à Rouvrois</li>
  <li>9e Cie : hauteurs boisées au Sud-Est de Spada</li>
</ul>
<p>Le P.C. du Bataillon et le Capitaine Adjudant-Major sont avec la 9e Cie. Le Chef de Bataillon s'installe à Spada, en P.C. avancé. La C.A.B.3 est répartie entre les compagnies de voltigeurs. Les ponts ont déjà tous sauté, mais dans de mauvaises conditions.</p>
<p>Le ravitaillement continue à se faire sur le pays. Il est, à Spada que les habitants viennent d'abandonner, particulièrement abondant. Malheureusement, les caves sont garnies et quelques légionnaires en abusent, contre lesquels il faut prendre de sévères sanctions.</p>`,

`<p>Travaux de défense. L'ordre est donné aux compagnies de s'alléger au maximum et de se mettre à même de marcher et de combattre dans les meilleures conditions. Vers midi, Spada est bombardé par l'aviation, sans résultat.</p>
<p>Le Bataillon reçoit l'ordre d'assurer aussi la défense des passages de Lacroix. La C.R.E. rejoint le Régiment qui s'est rapproché par voie de terre.</p>
<p class="pertes-title">Stationnement et dispositif défensif remaniés :</p>
<ul class="dispositif">
  <li>9e Cie : Rouvrois</li>
  <li>10e Cie : Lacroix</li>
  <li>11e Cie : Maizey</li>
  <li>P.C. Bataillon et C.A.B.3 : Spada</li>
  <li>Réserve : crête boisée Sud-Est</li>
</ul>
<p>Les ponts ont sauté. La défense s'organise. Dans les villages et sur les routes, à côté de colonnes qui se replient en ordre bien que hâtivement (grosse artillerie en particulier), il y a beaucoup de désordre ; à Lacroix en particulier.</p>
<p>Il est caractéristique que les routes ne sont presque plus survolées par l'aviation ennemie et que les convois, pourtant incessants, ne sont plus attaqués à la bombe, même de jour.</p>
<p>Dans la soirée les équipages rejoignent, puis l'ordre parvient de se replier sur Saint-Mihiel et au-delà.</p>`,

`<p><span class="date">Juin</span> — Le mouvement commence peu après minuit, sans que le Bataillon ait été relevé à la défense des ponts et passages. L'étape est courte mais la route de la rive droite de la Meuse est très encombrée par des colonnes à pied, hippos, autos. Il faut encore une fois se faufiler et dépasser. Saint-Mihiel, rapidement traversé, est particulièrement embouteillé.</p>
<p>Au jour, le Bataillon campe au Sud de Saint-Mihiel dans un petit bois au Nord de Brasseitte. Le P.C. R.I. est à Kœur.</p>
<p>L'après-midi, nouvel ordre de repli. Le Bataillon est chargé de la défense de la forêt de Vaucouleurs et du canal de la Marne au Rhin qui longe sa lisière Ouest. Mise en route dès 16 heures avec précautions, la menace de débordement s'accentuant à l'Ouest.</p>`,

`<p class="poignant">L'étape est à nouveau pénible sur une route encombrée de troupes qui se replient et de fuyards. La traversée des agglomérations (Lérouville et Commercy en particulier) permet d'assister malheureusement à des scènes navrantes de pillage et de désordre indescriptibles. Les cadres, la gendarmerie ne donnent pas toujours l'exemple. Il y a beaucoup de gens ivres.</p>
<p>Il est très difficile, surtout la nuit venue, d'empêcher ces exemples de gagner quelques légionnaires dont la masse reste cependant bien dans la main de ses chefs mais l'ensemble des troupes côtoyées est déjà en pleine déroute.</p>`,

`<p>Au petit jour, installation sur les lisières Nord-Ouest de la forêt de Vaucouleurs. Le P.C. R.I. est dans la forêt. La 9e Cie est au-dessus de Vacon, face au canal. La 10e Cie au Sud-Est de Void, face au Nord et au Nord-Est. La 11e Cie, amputée de la section Rusniak (de garde au T.R.), est à cheval sur la route, face à Void, avec le P.C. Bataillon. Elle est attaquée à la mitrailleuse par deux avions volant bas.</p>`,

`<p>Vers 11 heures, ordre de repli sur les bois de Saint-Germain, à l'Est de la Meuse — seule la 9e Cie avec une section de la C.A.B.3 restera sur place pour assurer la défense du canal en liaison, d'ailleurs non réalisée, avec un régiment de forteresse replié.</p>
<p class="poignant">Mission de sacrifice, étant donné surtout que la 9e Cie est réduite à une trentaine d'hommes.</p>
<p>Le mouvement s'exécute sans incident vers 14 heures. À 17 heures, le Bataillon, sauf la 9e Cie et son appui de mitrailleuses, sauf également une section de la 11e Cie, est installé défensivement face à l'Ouest et au Nord-Ouest sur les crêtes qui bordent la lisière Ouest des bois de Saint-Germain.</p>`,

`<p>Vers 19 heures rejoint la 9e Cie qui a été débordée par des éléments ayant franchi le canal par surprise. Elle a eu des pertes, a dû abandonner les mitrailleuses, sa camionnette mises hors d'usage par les tirs ennemis. Elle prend sa place dans le dispositif du Bataillon et pousse activement elle aussi les travaux de défense. Orage.</p>
<p>Le Chef de Bataillon cherche la liaison avec le P.C. R.I. à l'Est de Saint-Germain. Des bruits d'armistice circulent.</p>`,

`<p>Le Colonel Robert, commandant l'I.D., donne l'ordre d'aller réoccuper au cours de la deuxième partie de la nuit les positions perdues à l'Est du canal de la Marne au Rhin, non seulement Vacon, mais face à Sauvoy et Villeroy. Le 2e Bataillon ira reprendre les passages Sud de Void et enverra une compagnie à la gauche du 3e Bataillon. Une compagnie du 1er Bataillon tiendra le carrefour central de la forêt de Vaucouleurs. Le mouvement sera fonction du passage du 3e Bataillon qui est le plus éloigné ; point initial : pont de Saint-Germain.</p>
<p>En repartant, le Chef de Bataillon trouve une route complètement embouteillée et ne peut passer autrement qu'à pied, ce qui entraînera du retard. Il peut en prévenir le Commandant du Régiment venu s'installer entre-temps dans Saint-Germain.</p>
<p>Le Lieutenant Kakhowsky, blessé, est évacué.</p>`,

`<p><span class="date">Juin</span> — Vers 1 heure, le Chef de Bataillon peut rejoindre et réunir ses capitaines qui lui exposent l'état de fatigue des hommes, qui ont encore fourni un gros effort pour préparer la défense des bois, qui ont un besoin absolu d'un repos minimum de quelques heures et que l'échec de la veille a fortement impressionnés.</p>
<p>Accompagné par ses commandants de compagnie, le Chef de Bataillon se rend alors au P.C. le plus proche, c'est-à-dire auprès du Colonel Robert, à Rigny-la-Salle, afin de lui exposer son point de vue. Le mouvement prévu, qui ne correspond pas aux intentions du Commandement (défense des passages de la Meuse), ne peut être accompli dans de bonnes conditions surtout avant le jour par des hommes qui dorment, épuisés de fatigue, dans les trous épars qu'ils viennent de creuser.</p>
<p>Le Commandant de l'I.D. donne alors confirmation d'un contre-ordre qu'il vient d'envoyer au Régiment et qui n'a pu déjà parvenir. Ce nouvel ordre ne prévoit plus que la défense des passages de la Meuse avec constitution à l'Ouest de têtes de pont défensives. Le 3e Bataillon est chargé d'Ugny — Sud de Saint-Germain.</p>`,

`<p>Au lever du jour, le Capitaine Adjudant-Major part en liaison au P.C. R.I. et vers 7 heures, le Bataillon organise la défense d'Ugny : village, pont, tête de pont vers la ferme Gombervaux.</p>
<p>Le Régiment fait connaître le dispositif réalisé : le 2e Bataillon, non touché par le contre-ordre, a fait mouvement vers Void malgré que le 3e Bataillon ne se fut pas présenté au point initial. Il est appuyé par une compagnie du 1er Bataillon. Le P.C. R.I. reste à Saint-Germain.</p>
<p>Le Capitaine Lemoine, avec des éléments du 2e Bataillon, forme une tête de pont défensive à l'Ouest de Saint-Germain. Les deux têtes de pont, Saint-Germain et Ugny, sont confiées au Commandant du 3e Bataillon qui s'installe au passage à niveau d'Ugny, en liaison reprise à gauche avec le 9e R.T.M. et vers la route Void-Vaucouleurs avec des éléments d'une division coloniale.</p>`,

`<p>Les villages de Saint-Germain et d'Ugny sont violemment bombardés, plus particulièrement Saint-Germain sur lequel se concentre l'effort allemand. À Ugny, la 9e Cie tient le village. La 10e Cie et la 11e Cie, près de la route de Vaucouleurs, s'installent et patrouillent. Il y a quelques pertes parmi les éléments avancés et dans le village.</p>`,

`<p class="pertes-title">En fin de matinée :</p>
<ul class="dispositif">
  <li>a. Le Commandant renonce à commander directement la tête de pont de Saint-Germain, les liaisons ne pouvant plus passer que très difficilement</li>
  <li>b. Il est orienté sur la destruction du pont d'Ugny, qui s'avère délicate, faute de détonateurs. Il essaie de s'en procurer et y parviendra</li>
  <li>c. En vue de préparer le repli, il remanie son dispositif</li>
</ul>
<p>La 9e Cie tiendra Ugny jusqu'à la voie ferrée. La 10e Cie, passée sur la rive droite, s'organise en vue de défendre le pont et en bouchon éventuel face au Nord. La 11e Cie passe en réserve. P.C. Bataillon dans Ugny.</p>
<p>L'après-midi est assez calme ; quelques pertes du fait des bombardements. L'ordre parvient de passer sur la rive droite, de faire sauter le pont et de se replier sur Blénod-lès-Toul. Un contre-ordre prévoit peu après un arrêt de la journée du 19 dans les bois de Saint-Germain, en contenant l'ennemi. Il est exécuté sans incident vers 23 heures.</p>`,

`<p><span class="date">Juin</span> — Le 3e Bataillon, profitant de sa connaissance du terrain, a pu se rétablir face à l'Ouest, sur les hauteurs à l'Est de la Meuse légèrement au Sud des emplacements déjà occupés le 17 — au-dessus d'Ugny et des deux Rigny. Dans le but d'assurer la liaison avec le 9e R.T.M. et de garder la route Vaucouleurs-Blénod-lès-Toul, la 10e Cie, séparée du Bataillon par un ravin profond, est installée à un kilomètre Sud sur une croupe boisée qui domine le village de Rigny-la-Salle. Deux canons de 25 de la C.R.F. sont avec le Bataillon.</p>
<p>Jusqu'au jour les hommes terrassent en vue de réaliser leurs emplacements de combat. Au petit jour, liaison prise à droite avec le 1/11e Étranger qui n'est d'ailleurs pas au courant de la situation. À droite du 1/11e rien et en particulier pas de traces du 21e R.T.A. qui devrait s'y trouver (on apprendra par la suite que ce régiment n'a pas été touché par le contre-ordre de la veille). À gauche la 10e Cie ne trouve pas la liaison avec le 9e R.T.M.</p>
<p>Le Capitaine Adjudant-Major, parti faire des évacuations avec une voiture particulière prise à Ugny, cherche le P.C. R.I. qui est prévu à l'Est de Rigny ; il cherche aussi du ravitaillement.</p>`,

`<p>Dès que la brume se lève, on peut voir les colonnes allemandes arriver en formations serrées sur Saint-Germain, s'y déployer en toute tranquillité, et le bombardement commence ; les arbres nous protègent et, en particulier, un avion d'observation allemand nous cherche en vain. En même temps des colonnes allemandes, vraisemblablement d'infanterie, défilent sans arrêt de Void vers Vaucouleurs sans aucun souci d'échapper aux vues et aux coups.</p>
<p>Rapidement quelques motocyclistes qui ont pu franchir les ponts mal détruits se présentent sur la rive droite et déjà nous recevons des tirs d'infanterie qui se rapprochent.</p>
<p>Les Commandants des 1er et 3e Bataillons (ou plutôt de ce qui en reste), isolés, décident de se replier en décrochant très rapidement d'abord puis en combattant dès que des liaisons auront pu être prises avec les éléments voisins, de façon à gagner une journée avant de se présenter à Blénod, ce qui correspondrait, tout en limitant les dangers d'être coupés, à l'ordre reçu.</p>`,

`<p>Les ordres préparatoires sont donnés : la 10e Cie doit protéger le repli initial des autres unités. Les canons de 25, ne pouvant être emportés, sont détruits et abandonnés. Le mouvement s'exécute vers 10 heures alors que les Allemands arrivent au contact. Il leur échappe.</p>
<p>Il est prévu d'abord vers le Sud (afin surtout de prendre la liaison avec le 9e R.T.M. dont le Chef de Bataillon a connu la veille les ordres pour le lendemain), puis à partir de la route Vaucouleurs-Blénod-lès-Toul, vers l'Est, en empruntant les bois Sud de cette route, mais en barrant cet axe.</p>
<p>Rencontrant le Commandant de la 10e Cie qui n'est pas encore engagée, le Chef de Bataillon lui confirme les ordres donnés aux autres unités : « décrocher rapidement (quelques minutes derrière nous) à travers bois vers le Sud-Sud-Est. Le Bataillon se regroupera dans un des vallons que nous devons rencontrer. »</p>
<p>La 10e Cie pourra d'ailleurs exécuter son repli sans difficultés grâce à un mouvement de terrain et malgré que pressée par des cavaliers allemands qui engagent le combat à pied à trois cents mètres de sa ligne.</p>`,

`<p>Certains ravins sont occupés. Il faut glisser vers le Sud-Ouest. Des éléments ennemis se montrent déjà sur la route Vaucouleurs-Blénod, que le P.C. Bataillon traverse cependant.</p>
<p>Liaisons sont prises personnellement par le Chef de Bataillon avec le P.C. R.I. qui se replie sur Blénod et ne peut donner aucune précision complémentaire, avec le 21e R.T.A. qui, touché par le deuxième ordre de la veille, vient prendre sa place à droite du 11e Étranger et qui, en raison de la situation qu'on lui expose, va s'installer dans les bois de Domgermain avec un groupe de reconnaissance, enfin avec le 9e R.T.M. Se mettant à la disposition du Colonel de ce Régiment, le Chef de Bataillon reçoit l'ordre d'opérer en liaison avec un autre groupe de reconnaissance qui combat sur la route Blénod-Vaucouleurs et avec les bataillons du 9e R.T.M. qui combattent en repli. Le contact pris, il faudra attendre au moins jusqu'à la nuit. Ceci confirme les ordres reçus.</p>`,

`<p>Vers 15 heures, la situation est la suivante : le P.C. 3e Bataillon est près d'une ferme sur la route Blénod-Vaucouleurs, au Sud de la chapelle Saint-Fiacre. La 11e Cie sur la route et au Sud, en liaison avec les éléments du 9e R.T.M., est au contact. La 9e Cie est en soutien. Les restes de la C.A.B.3 protègent le Bataillon contre les dangers d'infiltration par les bois Sud où patrouillent des cavaliers allemands.</p>
<p>La 10e Cie paraît avoir glissé, et n'ayant pas trouvé le Bataillon (qui a dû, en effet, s'orienter légèrement au Sud-Ouest pour retrouver le 9e R.T.M.), elle a continué vers Blénod-lès-Toul, conformément à l'ordre initial. Le Bataillon ne retrouvera cette compagnie que le 21 juin. Le journal de marche de l'unité expose ce que fut son action vers Thuilley-aux-Groseilles et le bois de Moutrot avec le Capitaine Adjudant-Major et suivant ordres particuliers du Commandant de l'I.D.</p>
<p>Le 1er Bataillon est à proximité de la route et au Nord. Le 21e R.T.A., à droite, a pris position. Deux groupes de reconnaissances, un au Nord, l'autre à l'Ouest, participent aux barrages établis.</p>`,

`<p>Jusqu'à 17 heures, participation aux engagements qui, sur la route, permettent d'arrêter quelques voitures et des éléments légers. Le Bataillon, qui n'a pas mangé, peut tuer et faire cuire une vache. De Blénod arrivent par l'intermédiaire du 1er Bataillon quelques biscuits de guerre.</p>
<p>Vers 17 heures, la 7e Cie du 2e Bataillon, isolée au cours de son repli, se met à la disposition du Commandant du 3e Bataillon qui l'emploie sous bois, face au Sud et au Sud-Ouest.</p>`,

`<p class="poignant">Vers 18 heures, les Allemands attaquent, accompagnant leur action d'appels à la reddition et de violents tirs de mortiers. Partout, et conformément à l'ordre reçu, ils sont violemment contenus, en particulier par la 11e Cie et par les éléments en soutien qui tirent en flanquement, au profit du 1er Bataillon, sur des groupes allemands très agressifs. Le P.C. du Bataillon est particulièrement pris à partie par les mortiers.</p>
<p>Le combat se prolonge jusque vers 20 heures 30 et cesse brusquement, les Allemands n'insistant pas la nuit. Il y aura encore quelques salves de mortiers.</p>
<p>Les blessés, encore assez nombreux, compte tenu de l'effectif réduit qui reste, sont évacués non sans difficultés sur Blénod. Entre autres le Capitaine commandant la 11e Cie et d'assez nombreux sous-officiers.</p>`,

`<p>Entre-temps, l'ordre a été confirmé de repli sur Blénod. Après avoir prévenu le Commandant du 9e R.T.M. et après repli du 1er Bataillon, le Commandant du 3e Bataillon ramène d'abord en arrière la 11e Cie, fait partir par la route la 9e et la 11e Cie, puis, à 23 heures, se replie sous bois avec son P.C., la 7e Cie et la C.A.B.3. Pas d'incidents. Les tirs de mortiers ont presque complètement cessé. Regroupement à Blénod.</p>`,

`<p><span class="date">Juin</span> — Après quelques heures de sommeil, le Commandant du Régiment donne des ordres verbaux ; le Bataillon est mis en route et s'établit face à l'Ouest, au Nord-Ouest et au Nord sur les lisières du fort de Blénod-lès-Toul. Dans le fort, P.C. R.I. Le Bataillon est en liaison à sa gauche avec le 1er Bataillon et avec le 21e R.T.A.</p>
<p>Travaux de défense. Journée calme — au loin, Toul brûle. Ravitaillement important. Le Capitaine Adjudant-Major met le Commandant au courant de la situation de la 10e Cie.</p>`,

`<p><span class="date">Juin</span> — Vers 1 heure, ordre de repli vers Crésilles-Ochey. Après délibération et le Commandement confirmant son ordre (le Régiment voudrait s'enfermer dans le fort), les mouvements commencent vers 7 heures par Blénod. Aucune réaction adverse.</p>
<p>Vers 10 heures, le Bataillon, voulant s'installer face à l'Ouest sur la lisière Ouest des bois d'Ochey, trouve son quartier occupé par des chars, par la droite du 9e R.T.M. et par la gauche du 1/11e Étranger. Après liaison prise avec le P.C. R.I. (chemin Crésilles-Ochey, 1500 mètres d'Ochey), il est décidé que le Bataillon s'installera en soutien dans une clairière à 300 mètres Sud du P.C. R.I.</p>
<p>Des pourparlers de reddition sont engagés par le Général Dubuisson, ancien commandant de la défense de Verdun, qui est le plus ancien des généraux de 6 ou 8 divisions qui se trouvent désormais sans repli possible. Il n'y a plus de munitions d'artillerie, plus de carburant pour les chars, plus de ravitaillement.</p>
<p>La 7e Cie rejoint son bataillon. La 10e Cie rejoint vers 18 heures. Le sous-lieutenant Rayewski est remis à la disposition du Régiment.</p>`,

`<p><span class="date">Juin</span> — Nuit sans incident. Ravitaillement presque nul. Les hommes, épuisés, peuvent dormir. Nous sommes privés de tout renseignement sur la situation. En cas d'attaque avant la reddition, on se défendra.</p>
<p>Chaque bataillon a un tout petit front à défendre pour lequel suffit une forte section. Celle-ci, formée de volontaires, est commandée par le Lieutenant Binoche, de la C.A.B.3, et mise en place en ligne sous la direction du Chef de Bataillon. Auparavant celui-ci, ayant rassemblé le Bataillon, avait averti les hommes qu'il laissait chacun libre de filer individuellement pour traverser les lignes allemandes. Quelques hommes partent ; certains demandent à emporter leur arme, ce qui leur est accordé.</p>`,

`<p>Vers 11 heures, la reddition est annoncée. Repli du détachement Binoche. Le Bataillon se met en ordre dans sa clairière. Ce qui reste des voitures rejoint (les éléments du T.C.2 et du T.R. ont été ou capturés ou pillés). Ravitaillement surtout sur le pays. Mise en ordre du matériel restant ; les documents sont brûlés. Rédaction de propositions de citations. Appel nominatif.</p>
<p class="pertes-title">L'encadrement est le suivant :</p>
<ul class="dispositif">
  <li>Bataillon : Commandant Gaultier, Capitaine Marguet (Adjudant-Major), Adjudant Pellegrini (vaguemestre) — Médecin-Lieutenant Jagerschmidt, Médecin auxiliaire Dejean</li>
  <li>9e Cie : Capitaine Jayet, S/Lieutenant Viallon — Adjudant Liebuda</li>
  <li>10e Cie : Capitaine Trimaille</li>
  <li>11e Cie : Lieutenant Beaumont — Adjudant Buschhaus</li>
  <li>C.A.B.3 : Capitaine Baron, Lieutenant Binoche — Adjudant-Chef Siegenthaler</li>
</ul>
<p>À 19 heures, la capitulation est confirmée. Il reste un espoir : que l'Armistice entre en vigueur au cours de la nuit.</p>`,

`<p class="poignant"><span class="date">23 Juin</span> — Malheureusement ces espoirs ne se réalisent pas malgré que les cloches de tous les villages sonnent au cours de la nuit, et au petit jour, l'ordre est donné que les Bataillons, sans armes, dans la tenue la plus correcte possible, en ordre, se présenteront à Toul en colonne par trois, à partir de 9 heures.</p>
<p>Une messe émouvante a lieu. Les munitions sont enterrées. Les armes, en faisceaux, sont mises hors d'état de servir. Les camionnettes tournent sans huile et sans eau.</p>
<p>Quelques gradés et hommes sont partis dans la nuit par les bois. Il en part encore au dernier moment, dont le Chef de Bataillon et le Capitaine Adjudant-Major, et le Bataillon est mis en route, réduit à :</p>`,

`<ul class="dispositif">
  <li>Capitaine Baron</li>
  <li>Capitaine Jayet</li>
  <li>Lieutenant Binoche</li>
  <li>Lieutenant Beaumont</li>
  <li>Médecin-Lieutenant Jagerschmidt</li>
  <li>S/Lieutenant Viallon</li>
  <li>170 gradés et légionnaires</li>
</ul>
<p class="poignant">Le reste a été tué ou blessé ; quelques-uns ont disparu ; d'autres n'ont pu rejoindre. Enfin, il y a eu les départs autorisés de la dernière heure.</p>
<div class="sign-block">
  <p>Agadir, le 13 août 1942.</p>
  <p>Le Chef de Bataillon Gaultier.</p>
  <p class="signature">signé : Gaultier</p>
</div>
<p class="note">Document déchiré en marge droite ; signature manuscrite au bas de la page.</p>`,

];

const book = document.getElementById('book');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const folioLabel = document.getElementById('folioLabel');
let current = 0;
let pages = [];

// Fenetre de rendu : on ne monte dans le DOM que les feuillets proches de la
// page courante (au lieu des ~80-100 pages du carnet d'un coup). Chaque
// feuillet rendu porte des transforms 3D + drop-shadow ; en garder autant
// en meme temps sature la memoire du compositeur sur mobile et fait crasher
// l'onglet ("Impossible d'ouvrir cette page"). Les feuillets deja tournes ou
// pas encore atteints n'ont de toute facon aucun rendu visible distinct
// (memes dimensions, position absolute, inset:0), donc ne pas les monter ne
// change rien a l'affichage.
const RENDER_BEHIND = 1;
const RENDER_AHEAD = 2;
const leafEls = []; // tableau creux : index de page -> element .leaf ou undefined

// Assemble les blocs en pages, a taille de police FIXE, en mesurant sur une feuille cachee
// qui a exactement les memes dimensions/police que les vraies pages.
function computePages(){
  const measureLeaf = document.createElement('div');
  measureLeaf.className = 'leaf';
  measureLeaf.style.visibility = 'hidden';
  measureLeaf.style.zIndex = '-1';
  measureLeaf.innerHTML = `<div class="face front">
      <div class="page-chrome-top">XI° R.E.I. — I° Bataillon</div>
      <div class="page-content" id="__measure__"></div>
    </div>`;
  book.appendChild(measureLeaf);
  const mc = measureLeaf.querySelector('#__measure__');

  const result = [];
  let currentHtml = '';

  blocks.forEach(blockHtml => {
    const attempt = currentHtml + blockHtml;
    mc.innerHTML = attempt;
    const overflows = mc.scrollHeight > mc.clientHeight + 1;

    if (!overflows) {
      currentHtml = attempt;
    } else if (currentHtml === '') {
      // un seul bloc, deja trop grand pour une page : on le garde seul, sans le couper
      result.push(blockHtml);
      currentHtml = '';
    } else {
      result.push(currentHtml);
      mc.innerHTML = blockHtml;
      currentHtml = mc.scrollHeight > mc.clientHeight + 1 ? blockHtml : blockHtml;
    }
  });
  if (currentHtml) result.push(currentHtml);

  book.removeChild(measureLeaf);
  return result;
}

function leafContent(i){
  return `
      <div class="face front">
        <div class="page-chrome-top">XI° R.E.I. — I° Bataillon</div>
        <div class="page-content">${pages[i]}</div>
        <div class="folio">${i + 1}</div>
        <div class="corner-fold" data-dir="next"></div>
      </div>
      <div class="face back">
        <div class="corner-fold left" data-dir="prev"></div>
      </div>`;
}

// Cree (si besoin) et positionne le feuillet i ; ne fait rien s'il est deja
// monte et a jour.
function ensureLeaf(i){
  if (i < 0 || i >= pages.length) return null;
  let leaf = leafEls[i];
  if (!leaf){
    leaf = document.createElement('div');
    leaf.className = 'leaf';
    leaf.dataset.index = i;
    leaf.innerHTML = leafContent(i);
    leafEls[i] = leaf;
    book.appendChild(leaf);
  }
  if (i < current){
    leaf.classList.add('flipped');
    leaf.style.zIndex = i;
  } else {
    leaf.classList.remove('flipped');
    leaf.style.zIndex = pages.length - i;
  }
  return leaf;
}

// Retire du DOM les feuillets sortis de la fenetre de rendu autour de current.
function pruneLeaves(){
  leafEls.forEach((leaf, i) => {
    if (!leaf) return;
    if (i < current - RENDER_BEHIND || i > current + RENDER_AHEAD){
      leaf.remove();
      leafEls[i] = undefined;
    }
  });
}

function refreshWindow(){
  const from = Math.max(0, current - RENDER_BEHIND);
  const to = Math.min(pages.length - 1, current + RENDER_AHEAD);
  for (let i = from; i <= to; i++) ensureLeaf(i);
  pruneLeaves();
}

function buildBook(){
  book.innerHTML = '';
  leafEls.length = 0;
  refreshWindow();
}

function updateUI(){
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === pages.length;
  folioLabel.textContent = `Folio ${Math.min(current + 1, pages.length)} / ${pages.length}`;
}

function goNext(){
  if (current >= pages.length) return;
  const leaf = ensureLeaf(current);
  leaf.classList.add('flipped');
  leaf.style.zIndex = current;
  current++;
  refreshWindow();
  updateUI();
}

function goPrev(){
  if (current <= 0) return;
  current--;
  const leaf = ensureLeaf(current);
  leaf.classList.remove('flipped');
  leaf.style.zIndex = pages.length - current;
  refreshWindow();
  updateUI();
}

function rebuild(){
  const wasCurrent = current;
  pages = computePages();
  current = Math.min(wasCurrent, pages.length);
  buildBook();
  updateUI();
}

function init(){
  pages = computePages();
  buildBook();
  updateUI();
}

init();

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(rebuild);
}

let resizeTimer;
let lastInnerHeight = window.innerHeight;
window.addEventListener('resize', () => {
  // Sur mobile, l'apparition/disparition de la barre d'adresse declenche un
  // 'resize' pour quelques dizaines de pixels de hauteur ; ignorer ces
  // micro-variations evite de relancer inutilement computePages()+buildBook()
  // (couteux) a chaque scroll.
  const h = window.innerHeight;
  if (Math.abs(h - lastInnerHeight) < 100) return;
  lastInnerHeight = h;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(rebuild, 200);
});

nextBtn.addEventListener('click', goNext);
prevBtn.addEventListener('click', goPrev);

book.addEventListener('click', (e) => {
  const corner = e.target.closest('.corner-fold');
  if (!corner) return;
  if (corner.dataset.dir === 'next') goNext();
  else goPrev();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goNext();
  if (e.key === 'ArrowLeft') goPrev();
});
</script>
</body>
</html>
